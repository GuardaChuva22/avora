name: Go checks
on:
  push:
    paths: ["**/*.go", "go.mod", ".github/workflows/go.yml"]
  pull_request:
    paths: ["**/*.go", "go.mod", ".github/workflows/go.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
